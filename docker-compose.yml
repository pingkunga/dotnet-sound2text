services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Whisper__UseGpu: "true"
      Whisper__ModelPath: /models/ggml-large-v3-q5_0.bin
    volumes:
      - ./models:/models:ro
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
