<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound2Text</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --mut:#667085; --bd:#d0d5dd; --ac:#2563eb; --card:#f8fafc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e6e8eb; --mut:#98a2b3; --bd:#2a2f38; --ac:#60a5fa; --card:#171a21; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,"Noto Sans Thai",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--mut); margin:12px 0 4px; }
  input[type=file], select, input[type=text] { width:100%; box-sizing:border-box; padding:8px; border:1px solid var(--bd); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  button { margin-top:16px; padding:10px 18px; border:0; border-radius:6px; background:var(--ac); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  progress { width:100%; height:14px; }
  .seg { display:flex; gap:12px; padding:4px 0; }
  .ts { color:var(--mut); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .err { color:#dc2626; }
  a.dl { margin-right:12px; color:var(--ac); }
  [hidden] { display:none; }
  .row { display:flex; gap:8px; align-items:center; padding:4px 0; border-bottom:1px solid var(--bd); }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .row button, .head button { margin:0; padding:2px 10px; font-size:.85rem; background:transparent; color:var(--ac); border:1px solid var(--bd); }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <h1>Sound2Text</h1>
  <form id="f" class="card">
    <label for="file">ไฟล์เสียง</label>
    <input id="file" type="file" accept="audio/*,video/*" required>
    <label for="lang">ภาษา</label>
    <select id="lang">
      <option value="th">ไทย (มีอังกฤษปนได้) — แนะนำ</option>
      <option value="en">English</option>
      <option value="auto">Auto (ตรวจภาษาทีละช่วง)</option>
    </select>
    <label for="hint">คำช่วย (ไม่บังคับ) เช่น ศัพท์อังกฤษ/ชื่อที่จะพูดถึง</label>
    <input id="hint" type="text" placeholder="Kubernetes, API, Sprint planning">
    <button id="go" type="submit">ถอดเสียง</button>
  </form>

  <div id="job" class="card" hidden>
    <div id="status"></div>
    <progress id="bar" max="1" value="0"></progress>
    <div id="dl" hidden>
      <a class="dl" id="txt">TXT</a><a class="dl" id="srt">SRT</a><a class="dl" id="vtt">VTT</a>
    </div>
    <div id="out"></div>
  </div>
  <div class="card">
    <div class="head"><strong>คิวงาน</strong><button id="clear" type="button">ล้างคิว</button></div>
    <div id="jobs"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = s => new Date(s * 1000).toISOString().substr(11, 8);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append('file', $('file').files[0]);
  fd.append('language', $('lang').value);
  fd.append('hint', $('hint').value);
  $('go').disabled = true;
  $('job').hidden = false; $('dl').hidden = true; $('out').textContent = '';
  $('status').textContent = 'กำลังอัปโหลด...'; $('bar').value = 0;
  const r = await fetch('/api/jobs', { method: 'POST', body: fd });
  if (!r.ok) { $('status').innerHTML = '<span class="err">' + await r.text() + '</span>'; $('go').disabled = false; return; }
  poll((await r.json()).id);
});

let cur = null;

async function loadJobs() {
  const list = await (await fetch('/api/jobs')).json();
  $('jobs').replaceChildren(...list.map(j => {
    const r = document.createElement('div'); r.className = 'row';
    const n = document.createElement('span'); n.className = 'name'; n.textContent = j.fileName; n.title = j.fileName;
    n.onclick = () => { if (j.status === 'Done') show(j.id); };
    const st = document.createElement('span'); st.className = 'ts';
    st.textContent = j.status + (j.status === 'Running' ? ' ' + Math.round(j.progress * 100) + '%' : '');
    r.append(n, st);
    const act = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = async () => { await fn(); loadJobs(); }; r.append(b); };
    if (j.status === 'Queued' || j.status === 'Running') act('ยกเลิก', () => fetch('/api/jobs/' + j.id + '/cancel', { method: 'POST' }));
    else act('ลบ', () => fetch('/api/jobs/' + j.id, { method: 'DELETE' }));
    return r;
  }));
}

$('clear').onclick = async () => {
  if (!confirm('ยกเลิกงานที่รออยู่และงานที่กำลังรันทั้งหมด?')) return;
  await fetch('/api/jobs/clear-queue', { method: 'POST' });
  loadJobs();
};

function show(id) { $('job').hidden = false; poll(id); }

setInterval(loadJobs, 3000);
loadJobs();

async function poll(id) {
  cur = id;
  const j = await (await fetch('/api/jobs/' + id)).json();
  $('bar').value = j.progress;
  $('status').textContent = j.status + ' ' + Math.round(j.progress * 100) + '%';
  if (j.status === 'Done') {
    $('status').textContent = 'เสร็จแล้ว (' + Math.round(j.elapsedSec) + ' วินาที สำหรับเสียง ' + Math.round(j.audioSec) + ' วินาที)';
    for (const f of ['txt', 'srt', 'vtt']) $(f).href = '/api/jobs/' + id + '/export?fmt=' + f;
    $('dl').hidden = false;
    $('out').replaceChildren(...j.segments.map(s => {
      const d = document.createElement('div'); d.className = 'seg';
      const t = document.createElement('span'); t.className = 'ts'; t.textContent = fmt(s.start);
      const x = document.createElement('span'); x.textContent = s.text;
      d.append(t, x); return d;
    }));
    $('go').disabled = false;
  } else if (j.status === 'Failed') {
    $('status').innerHTML = '<span class="err">ผิดพลาด: </span>'; $('status').append(j.error || '');
    $('go').disabled = false;
  } else if (j.status === 'Cancelled') {
    $('status').textContent = 'ยกเลิกแล้ว'; $('go').disabled = false;
  } else if (cur === id) setTimeout(() => poll(id), 1500);
}
</script>
</body>
</html>
